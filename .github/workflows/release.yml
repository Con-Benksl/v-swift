name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            label: macOS (Apple Silicon)
          - platform: ubuntu-22.04
            args: ""
            label: Linux (x86_64)
          - platform: windows-latest
            args: ""
            label: Windows (x86_64)

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file

      - name: Install npm dependencies
        run: npm ci

      - name: Build & publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "V-Swift ${{ github.ref_name }}"
          releaseBody: |
            ## 安装方式

            从下方 **Assets** 下载对应平台的安装包：

            | 平台 | 文件 |
            |---|---|
            | macOS (Apple Silicon, M1/M2/M3) | `*_aarch64.dmg` |
            | Windows (x86_64) | `*_x64-setup.exe` 或 `*_x64_en-US.msi` |
            | Linux (Debian/Ubuntu) | `*_amd64.deb` |
            | Linux (其他发行版) | `*_amd64.AppImage` |

            > 本软件仅供学习研究用途。详见仓库 README 免责声明。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # AppImageHub 要求 AppImage 嵌入 update info 并随包发布 .zsync（见 #7429 复检 warning）。
      # tauri-bundler 不支持该选项，故在构建后直接 patch 二进制。
      # 注意：完整重打包（appimagetool 解包再压）会改变 squashfs 二进制布局，
      # 实测会导致 AppImageHub 机器人 firejail 测试报 AppRun Permission denied（v0.5.2 翻车）。
      # 因此采用最小补丁：只改 runtime 中 90 字节的 update info 槽位（offset 932097），
      # squashfs 原样保留。offset 与 runtime 版本绑定，patch 前会校验哨兵，失败则直接报错。
      # 二进制变化后必须重签名，否则内置自动更新的签名校验会失败，latest.json 的 Linux 条目签名同步更新。
      - name: Embed AppImage update info and publish zsync
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/release/bundle/appimage"
          cd "$BUNDLE_DIR"
          APPIMAGE="$(ls V-Swift_*_amd64.AppImage | head -n 1)"
          echo "Processing $APPIMAGE"
          chmod +x "$APPIMAGE"

          # 最小补丁：在 runtime 的 update info 槽位写入 90 字节（16 字节校验 + 字符串）
          # hex 由 appimagetool 对同版本 runtime 生成并实测验证（--appimage-updateinfo 可读出）
          python3 - "$APPIMAGE" <<'PYEOF'
          import sys
          path = sys.argv[1]
          OFFSET = 932097
          # 16 字节校验 + "gh-releases-zsync|Con-Benksl|v-swift|latest|V-Swift_*_amd64.AppImage.zsync" + NUL 补齐
          BLOCK = bytes.fromhex(
              "405c8171a22717ab79483902476a15"
              "67682d72656c65617365732d7a73796e63"
              "7c436f6e2d42656e6b736c7c762d7377696674"
              "7c6c61746573747c562d53776966745f2a5f616d643634"
              "2e417070496d6167652e7a73796e6300"
          )
          assert len(BLOCK) == 90, f"block len {len(BLOCK)}"
          with open(path, "r+b") as f:
              f.seek(OFFSET)
              old = f.read(90)
              # 哨兵校验：原槽位应为"空"（无 update info），防止 runtime 版本变化导致 offset 漂移
              assert b"gh-releases-zsync" not in old, "update info already present, abort"
              assert old[16:] == b"\x00" * 74, f"sentinel mismatch at offset {OFFSET}, runtime may have changed"
              f.seek(OFFSET)
              f.write(BLOCK)
          print("update info patched")
          PYEOF

          # 校验 runtime 能正确读出
          ./"$APPIMAGE" --appimage-updateinfo | grep -q "gh-releases-zsync|Con-Benksl|v-swift"

          # 生成 .zsync（供 AppImageUpdate 差量更新）
          sudo apt-get install -y zsync
          zsyncmake -u "https://github.com/Con-Benksl/v-swift/releases/download/${GITHUB_REF_NAME}/${APPIMAGE}.zsync" "$APPIMAGE"
          test -f "$APPIMAGE.zsync"

          # 二进制已变，原签名失效：用 Tauri 签名密钥重新签名
          rm -f "$APPIMAGE.sig"
          npx tauri signer sign --app-version "${GITHUB_REF_NAME#v}" "$APPIMAGE"
          test -f "$APPIMAGE.sig"

          # 替换发布资产：新 AppImage + .zsync + 新签名
          gh release upload "${{ github.ref_name }}" "$APPIMAGE" "$APPIMAGE.zsync" "$APPIMAGE.sig" --clobber

          # latest.json 里 Linux 条目的签名同步为新签名（其值为 .sig 文件原文）
          gh release download "${{ github.ref_name }}" -p "latest.json" -D /tmp/latest-json
          python3 - "$APPIMAGE.sig" <<'PYEOF'
          import json, sys
          sig = open(sys.argv[1]).read()
          p = "/tmp/latest-json/latest.json"
          d = json.load(open(p))
          for key in ("linux-x86_64", "linux-x86_64-appimage"):
              if key in d["platforms"]:
                  d["platforms"][key]["signature"] = sig
          json.dump(d, open(p, "w"), indent=2, ensure_ascii=False)
          print("latest.json signatures updated")
          PYEOF
          gh release upload "${{ github.ref_name }}" /tmp/latest-json/latest.json --clobber
          echo "AppImage update info embedded, zsync published, signatures refreshed"
